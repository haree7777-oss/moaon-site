<main>
<section class="band cream"><div class="wrap order">
  <h1 class="bar">두두 곡식 알림 신청</h1>
  <p>예약을 시작하면 가장 먼저 문자로 알려드리겠습니다.</p>
  <form id="order-form" style="margin-top:28px">
    <div class="field"><label for="f-name">이름</label><input id="f-name" name="name" type="text" autocomplete="name" required></div>
    <div class="field"><label for="f-tel">연락처</label><input id="f-tel" name="tel" type="tel" inputmode="tel" autocomplete="tel" required></div>
    <fieldset class="field">
      <legend>관심 곡식 (선택)</legend>
      <label class="check"><input type="checkbox" name="grain" value="신동진 쌀">신동진 쌀</label>
      <label class="check"><input type="checkbox" name="grain" value="동진찰 찹쌀">동진찰 찹쌀</label>
      <label class="check"><input type="checkbox" name="grain" value="선풍 콩">선풍 콩</label>
    </fieldset>
    <div class="field">
      <label class="check agree"><input type="checkbox" name="agree" required>[필수] 개인정보 수집·이용 동의</label>
      <p class="agree-text">예약 시작을 알려드리기 위해 이름과 연락처를 받습니다.</p>
    </div>
    <button class="btn" type="submit">알림 신청하기</button>
  </form>
  <div class="order-done" id="order-done" hidden role="status">
    <p>신청을 보냈습니다. 예약을 시작하면 문자로 알려드리겠습니다.</p>
    <div class="call"><button class="btn line" type="button" id="order-copy">복사</button><a class="btn line" id="order-mail" href="mailto:haree7777@gmail.com">이메일</a></div>
  </div>
</div></section>
</main>
