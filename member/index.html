<main id="main">
<div class="wrap narrow" id="me-page" style="padding-block:40px 56px">
  <div class="me-head"><h1 data-me="name">마이페이지</h1><p class="small sub" data-me="perk"></p></div>
  <div class="me-tabs" role="tablist">
    <button type="button" role="tab" data-tab="orders" aria-selected="true">주문내역</button>
    <button type="button" role="tab" data-tab="regular" aria-selected="false">정기 배송 관리</button>
    <button type="button" role="tab" data-tab="info" aria-selected="false">회원정보 수정</button>
  </div>
  <div data-pane="orders" id="me-orders" class="form"></div>
  <div data-pane="regular" id="me-regular" class="form" hidden></div>
  <div data-pane="info" hidden>
    <form id="me-form" class="form" novalidate>
      <label class="field">이름 <input name="name" autocomplete="name"></label>
      <section>
        <span class="field">주소</span>
        <div class="row-in"><input class="inp" name="zip" placeholder="우편번호" aria-label="우편번호" readonly><button type="button" class="btn line" data-addr-search>주소 검색</button></div>
        <label class="field"><span class="sr">주소</span><input name="address" placeholder="주소" autocomplete="street-address"></label>
        <label class="field"><span class="sr">상세 주소</span><input name="addr2" placeholder="상세 주소"></label>
      </section>
      <section>
        <h2 class="h3">비밀번호 바꾸기</h2>
        <label class="field">지금 비밀번호 <input name="password" type="password" autocomplete="current-password"></label>
        <label class="field">새 비밀번호 (8자 이상, 영문·숫자) <input name="newPassword" type="password" autocomplete="new-password"></label>
      </section>
      <label class="check"><input type="checkbox" name="news">소식 받기</label>
      <p class="hint" data-me-msg aria-live="polite"></p>
      <button type="submit" class="btn wide">저장</button>
    </form>
  </div>
  <p style="margin-top:32px"><button type="button" class="btn line" data-logout>로그아웃</button></p>
  <p style="margin-top:24px"><button type="button" class="link sub small" data-leave>회원 탈퇴</button></p>
  <div id="leave-box" class="box" hidden><p>탈퇴하면 주소와 회원 정보를 지웁니다. 주문 기록은 법에 따라 5년 보관합니다.</p><div class="two"><button type="button" class="btn" data-leave-yes>탈퇴하기</button><button type="button" class="btn line" data-leave-no>취소</button></div></div>
</div>
