<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>시험판 · 두두농장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .t-wrap { max-width: 560px; margin: 0 auto; padding: 40px 16px 64px; }
  .t-wrap h1 { font-size: 24px; margin: 0 0 8px; }
  .t-wrap p, .t-wrap li { line-height: 1.7; }
  .t-state { margin: 20px 0; padding: 12px 14px; border-radius: 10px; background: #f3f1ec; font-weight: 600; }
  .t-state.on { background: #fff3d6; color: #7a4f00; }
  .t-btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 28px; }
  .t-btns button, .t-btns a { font: inherit; font-size: 15px; padding: 12px 18px; border-radius: 10px; border: 1px solid #3f5f2f; background: #3f5f2f; color: #fff; text-decoration: none; cursor: pointer; }
  .t-btns .ghost { background: #fff; color: #3f5f2f; }
</style>
</head>
<body>
<main class="t-wrap">
  <h1>두두 시험판</h1>
  <p>대표 확인용입니다. 켜면 <b>이 브라우저에서만</b> 홈페이지가 시험 장부로 움직입니다.</p>
  <div id="state" class="t-state">확인 중…</div>
  <div class="t-btns">
    <button id="on" type="button">시험판 켜기</button>
    <button id="off" type="button" class="ghost">시험판 끄기</button>
    <a href="/doodoo/" class="ghost">쇼핑 시작</a>
  </div>
  <ul>
    <li>주문·회원은 「두두 고객장부 (시험)」에만 기록됩니다.</li>
    <li>결제는 흉내 결제창이라 돈이 나가지 않습니다(실패도 골라 볼 수 있음).</li>
    <li>문자는 실제로 나가지 않고, 나갈 문구가 주문 관리(시험) 화면의 「문자」에 남습니다.</li>
    <li>회원가입 인증번호는 문자 대신 화면에 바로 나옵니다.</li>
    <li>가격·재고·작업 달력은 시험 값입니다(쌀 4,000원/kg, 콩 6,000원/kg, 배송비 4,000원).</li>
  </ul>
</main>
<script>
(function () {
  function get() { try { return localStorage.getItem('doodoo-test') === 'on'; } catch (e) { return false; } }
  function set(v) {
    try {
      if (v) localStorage.setItem('doodoo-test', 'on'); else localStorage.removeItem('doodoo-test');
      ['doodoo-cart', 'doodoo-buy', 'doodoo-token', 'doodoo-last', 'doodoo-sw'].forEach(function (k) { localStorage.removeItem(k); sessionStorage.removeItem(k); });
    } catch (e) {}
    draw();
  }
  function draw() {
    var on = get(), el = document.getElementById('state');
    el.textContent = on ? '지금 이 브라우저는 시험판입니다.' : '지금은 실제 홈페이지입니다(시험판 꺼짐).';
    el.className = 't-state' + (on ? ' on' : '');
  }
  document.getElementById('on').onclick = function () { set(true); };
  document.getElementById('off').onclick = function () { set(false); };
  if (/[?&]off\b/.test(location.search)) set(false);
  draw();
})();
</script>
</body>
</html>
