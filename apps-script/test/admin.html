<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>주문 관리 화면 미리보기</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%;display:block}#out{display:none}</style>
<!-- 가짜 장부에서 시험을 다 돌린 뒤(주문이 쌓인 상태) 주문 관리 화면(Admin.html)을 띄운다. google.script.run 은 같은 창의 Code.js 함수를 부른다. -->
<ol id="out"></ol>
<script src="shim.js"></script>
<script src="../Code.js"></script>
<script src="tests.js"></script>
<iframe id="f" title="주문 관리"></iframe>
<script>
(function () {
  function runner(ok, fail) {
    var r = {
      withSuccessHandler: function (f) { return runner(f, fail); },
      withFailureHandler: function (f) { return runner(ok, f); }
    };
    ['adminLoad', 'adminAct', 'adminOrder'].forEach(function (name) {
      r[name] = function () {
        var args = arguments;
        setTimeout(function () {
          try { var v = JSON.parse(JSON.stringify(window[name].apply(null, args))); ok && ok(v); }
          catch (e) { fail && fail(e); }
        }, 150);
      };
    });
    return r;
  }
  window.__google = { script: { get run() { return runner(null, null); } } };
  fetch('../Admin.html').then(function (r) { return r.text(); }).then(function (h) {
    document.getElementById('f').srcdoc = h.replace('<head>', '<head><script>var google = parent.__google;<\/script>');
  });
})();
</script>
</html>
