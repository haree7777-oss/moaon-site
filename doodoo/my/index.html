<main id="main">
<div class="wrap narrow" style="padding-block:40px 56px">
  <h1 class="page-title">비회원 주문조회</h1>
  <form id="my-form" class="form" novalidate>
    <label class="field">휴대폰 번호 <input name="tel" type="tel" inputmode="numeric" autocomplete="tel"></label>
    <label class="field">주문번호 <input name="no" autocomplete="off" autocapitalize="characters" placeholder="예: D261120-001"></label>
    <p class="hint">주문번호는 주문 완료 화면과 확정 안내에 있습니다.</p>
    <button type="submit" class="btn wide">조회하기</button>
    <p class="err my-msg" role="alert" hidden></p>
    <p class="hint" data-m="on" hidden>회원이시면 <a class="link" href="/member/login/">로그인</a>하고 마이페이지에서 보세요.</p>
  </form>
  <div id="my-result" class="form" style="margin-top:32px" aria-live="polite" hidden></div>
</div>
</main>
